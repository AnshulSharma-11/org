# ─────────────────────────────────────────────
# Application
# ─────────────────────────────────────────────
spring.application.name=orgpluse


# ─────────────────────────────────────────────
# MySQL
# ─────────────────────────────────────────────
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
#spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ─────────────────────────────────────────────
# JPA / Hibernate
# ─────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC


# ─────────────────────────────────────────────
# File Upload
# ─────────────────────────────────────────────
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
file.upload-dir=uploads


# ─────────────────────────────────────────────
# Server
# ─────────────────────────────────────────────
server.port=${PORT:8080}


# ─────────────────────────────────────────────
# JWT
# ─────────────────────────────────────────────
jwt.secret=${JWT_SECRET}

# ─────────────────────────────────────────────
# Razorpay
# ─────────────────────────────────────────────
razorpay.key.id=${RAZORPAY_KEY_ID}
razorpay.key.secret=${RAZORPAY_KEY_SECRET}


# ─────────────────────────────────────────────
# Logging
# ─────────────────────────────────────────────
logging.level.com.orgpluse=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate.SQL=DEBUG

# ─────────────────────────────────────────────
# Attendance (all optional — defaults shown)
# ─────────────────────────────────────────────
attendance.zone=${ATTENDANCE_ZONE:Asia/Kolkata}
attendance.shift-start=${ATTENDANCE_SHIFT_START:10:00}
attendance.grace-minutes=${ATTENDANCE_GRACE_MINUTES:0}
attendance.weekend-days=${ATTENDANCE_WEEKEND_DAYS:SATURDAY,SUNDAY}
