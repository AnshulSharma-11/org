<!DOCTYPE html>
<html lang="en" data-theme="light" data-bs-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="ORGPLUS — Employee Management System" />
    <title>ORGPLUS — Employee Management System</title>

    <link rel="icon" type="image/png" href="%PUBLIC_URL%/favicon.png" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

    <!-- Apply the saved (or system) theme before first paint → no white flash in dark mode -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('orgplus_theme');
          if (t !== 'light' && t !== 'dark') {
            t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          var r = document.documentElement;
          r.setAttribute('data-theme', t);
          r.setAttribute('data-bs-theme', t);
          document.querySelector('meta[name="theme-color"]').setAttribute('content', t === 'dark' ? '#141618' : '#ffffff');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
